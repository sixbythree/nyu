        <header>

    <section class="dashboard">

                <canvas id="movement"></canvas>

        </div>
        <div id="chartI" class="chart-container">
            <canvas id="inflow"></canvas>
        </div>
        <div id="result"></div>
    </section>    
</body>
<footer>
