<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link href="reset.css" rel="stylesheet"> -->
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" type="module"></script> 
    <script src="darkMode.js"></script> 
    
</head>
<body>
    <section>
        <header>
            <h1>Flux ITP</h1>
            <span id="current-time"></span>
            <button id="dark-mode-button">Dark Mode</button>
        </header>
        <nav id="view">
            <div class="chart-view" id="view">Inflow</div>
        </nav>
    </section> 
    <section class="dashboard">
        <div class="top-charts">
            <div class="mini-chart c1">
                <h3>Most Recent Data</h3>
                <canvas id="movement"></canvas>
            </div>
            <div class="mini-chart c2">
                <h3>Floor Population</h3>
                <div class="circle">
                    <p id="population"></p>
                </div> 
            </div>
        </div>
        <div id="chartI" class="chart-container">
            <div class="datePicker">
                <button id="prevDay">⬅️</button><span id="dateDisplay"></span><button id="nextDay">➡️</button>
                </div>
            <h3>Hourly Flux</h3>
            <canvas id="inflow"></canvas>
        </div>
        <div id="result"></div>
    </section>
</body>
<footer>
    <script src="scriptChart.js" type="module"></script>
    <!-- <script src="scriptTime.js"> </script> -->
    <!-- <script src="viewToggle.js"></script> -->
</footer>
</html>
